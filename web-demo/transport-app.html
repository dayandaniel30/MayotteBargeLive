<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transport App - UI Demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              navy: {
                900: "#001a4d",
                800: "#002266",
                700: "#002b80",
                600: "#0033a0",
              },
              brand: {
                500: "#1e63d1",
                400: "#3a86ff",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
            boxShadow: {
              soft: "0 10px 30px -10px rgba(0, 20, 80, 0.25)",
              card: "0 20px 50px -20px rgba(0, 20, 80, 0.4)",
            },
          },
        },
      };
    </script>
    <style>
      html,
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(135deg, #cfe3ff 0%, #9fc4f5 100%);
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.460.0?deps=react@18.3.1"
        }
      }
    </script>

    <script type="module">
      import React, { useState } from "react";
      import { createRoot } from "react-dom/client";
      import {
        Search,
        Home,
        User,
        MapPin,
        Clock,
        Train,
        Bus,
        ArrowLeft,
        CreditCard,
        Wallet,
        QrCode,
        ChevronRight,
      } from "lucide-react";

      const h = React.createElement;

      /* --------------------------- Shared UI Pieces --------------------------- */

      const PhoneFrame = ({ children }) =>
        h(
          "div",
          {
            className:
              "relative w-full max-w-sm mx-auto h-[780px] bg-navy-800 rounded-[2.5rem] overflow-hidden shadow-card ring-1 ring-black/5",
          },
          children,
        );

      const BottomNav = ({ active = "home", onNavigate }) => {
        const items = [
          { key: "home", icon: Home },
          { key: "profile", icon: User },
          { key: "map", icon: MapPin },
        ];
        return h(
          "div",
          {
            className:
              "absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 py-4 px-10 flex justify-between items-center",
          },
          items.map(({ key, icon: Icon }) =>
            h(
              "button",
              {
                key,
                onClick: () => onNavigate && onNavigate(key),
                className: `p-2 rounded-full transition-all ${
                  active === key ? "text-navy-800" : "text-slate-400"
                } hover:text-navy-800`,
              },
              h(Icon, {
                size: 26,
                strokeWidth: active === key ? 2.4 : 1.8,
                fill: active === key ? "#002266" : "none",
              }),
            ),
          ),
        );
      };

      /* ------------------------------ Home Screen ----------------------------- */

      const HomeScreen = ({ onSelectTransport }) =>
        h(
          PhoneFrame,
          null,
          h(
            "div",
            { className: "h-full flex flex-col" },
            // Header
            h(
              "div",
              { className: "bg-navy-800 px-7 pt-14 pb-28 relative" },
              h(
                "div",
                { className: "flex justify-between items-start" },
                h(
                  "div",
                  null,
                  h(
                    "h1",
                    {
                      className:
                        "text-white text-3xl font-bold leading-tight tracking-tight",
                    },
                    "Hello,",
                    h("br"),
                    "John Doe",
                  ),
                  h(
                    "p",
                    { className: "text-white/70 text-sm mt-3" },
                    "Where you will go",
                  ),
                ),
                h("div", {
                  className:
                    "w-10 h-10 rounded-full bg-white/30 ring-2 ring-white/20",
                }),
              ),
              // Search bar
              h(
                "div",
                {
                  className:
                    "mt-5 bg-white rounded-full flex items-center px-5 py-3 shadow-soft",
                },
                h(Search, { size: 18, className: "text-navy-800 mr-3" }),
                h("input", {
                  type: "text",
                  placeholder: "Search",
                  className:
                    "flex-1 bg-transparent outline-none text-sm text-navy-800 placeholder-slate-400",
                }),
              ),
            ),
            // Empty card overlap
            h(
              "div",
              { className: "-mt-16 px-7" },
              h("div", {
                className: "bg-white rounded-3xl h-24 shadow-soft",
              }),
            ),
            // Content
            h(
              "div",
              {
                className:
                  "flex-1 px-7 pt-7 bg-gradient-to-b from-slate-50 to-white overflow-y-auto",
              },
              h(
                "h2",
                {
                  className: "text-navy-800 text-lg font-bold mb-4",
                },
                "Choose your Transport",
              ),
              // Bus card
              h(
                "button",
                {
                  onClick: () => onSelectTransport("bus"),
                  className:
                    "w-full bg-brand-500 rounded-3xl p-5 text-left mb-4 shadow-soft relative overflow-hidden hover:scale-[1.02] transition-transform",
                },
                h(
                  "div",
                  { className: "flex justify-between items-center" },
                  h(
                    "div",
                    null,
                    h(
                      "h3",
                      { className: "text-white text-xl font-bold mb-4" },
                      "Bus",
                    ),
                    h(
                      "span",
                      {
                        className:
                          "inline-block bg-navy-800 text-white text-xs font-semibold px-4 py-1.5 rounded-full",
                      },
                      "Select",
                    ),
                  ),
                  h(Bus, {
                    size: 90,
                    className: "text-white drop-shadow-md",
                    strokeWidth: 1.4,
                  }),
                ),
              ),
              // MRT card
              h(
                "button",
                {
                  onClick: () => onSelectTransport("mrt"),
                  className:
                    "w-full bg-navy-800 rounded-3xl p-5 text-left shadow-soft relative overflow-hidden hover:scale-[1.02] transition-transform",
                },
                h(
                  "div",
                  { className: "flex justify-between items-center" },
                  h(
                    "div",
                    null,
                    h(
                      "h3",
                      { className: "text-white text-xl font-bold mb-4" },
                      "MRT",
                    ),
                    h(
                      "span",
                      {
                        className:
                          "inline-block bg-white text-navy-800 text-xs font-semibold px-4 py-1.5 rounded-full",
                      },
                      "Select",
                    ),
                  ),
                  h(Train, {
                    size: 90,
                    className: "text-white drop-shadow-md",
                    strokeWidth: 1.4,
                  }),
                ),
              ),
              h("div", { className: "h-24" }),
            ),
            h(BottomNav, { active: "home" }),
          ),
        );

      /* ---------------------------- Schedule Screen --------------------------- */

      const scheduleData = [
        { from: "10 : 00", to: "10 : 30" },
        { from: "11 : 05", to: "11 : 45" },
        { from: "11 : 25", to: "12 : 30" },
        { from: "13 : 10", to: "13 : 45" },
      ];

      const ScheduleScreen = ({ onBack, onSelectSchedule }) =>
        h(
          PhoneFrame,
          null,
          h(
            "div",
            { className: "h-full flex flex-col" },
            // Header with train illustration
            h(
              "div",
              { className: "bg-navy-800 px-7 pt-14 pb-10 relative" },
              h(
                "div",
                { className: "flex items-center justify-between mb-4" },
                h(
                  "button",
                  {
                    onClick: onBack,
                    className:
                      "p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition",
                  },
                  h(ArrowLeft, { size: 20 }),
                ),
                h(
                  "h1",
                  { className: "text-white text-2xl font-bold" },
                  "MRT",
                ),
                h("div", { className: "w-9" }),
              ),
              h(
                "div",
                { className: "flex justify-center py-4" },
                h(Train, {
                  size: 150,
                  className: "text-white drop-shadow-xl",
                  strokeWidth: 1.3,
                }),
              ),
            ),
            // Main content
            h(
              "div",
              {
                className:
                  "flex-1 bg-white rounded-t-[2.5rem] -mt-6 px-7 pt-8 pb-28 overflow-y-auto",
              },
              // Trip card
              h(
                "div",
                {
                  className:
                    "bg-white rounded-2xl shadow-soft border border-slate-100 p-5 mb-8",
                },
                h(
                  "div",
                  { className: "flex" },
                  h(
                    "div",
                    {
                      className:
                        "flex flex-col items-center mr-4 pt-1",
                    },
                    h(MapPin, {
                      size: 18,
                      className: "text-navy-800",
                      fill: "#002266",
                    }),
                    h("div", {
                      className:
                        "flex-1 border-l-2 border-dotted border-slate-300 my-1 min-h-[28px]",
                    }),
                    h(MapPin, {
                      size: 18,
                      className: "text-navy-800",
                    }),
                  ),
                  h(
                    "div",
                    { className: "flex-1" },
                    h(
                      "div",
                      { className: "mb-3" },
                      h(
                        "p",
                        {
                          className:
                            "text-slate-400 text-xs font-medium mb-1",
                        },
                        "From",
                      ),
                      h(
                        "p",
                        {
                          className:
                            "text-navy-800 text-sm font-semibold",
                        },
                        "Blue Castle, Indira Nagar, Bangalore",
                      ),
                    ),
                    h(
                      "div",
                      null,
                      h(
                        "p",
                        {
                          className:
                            "text-slate-400 text-xs font-medium mb-1",
                        },
                        "To",
                      ),
                      h("div", {
                        className:
                          "h-[1px] bg-slate-200 w-3/4",
                      }),
                    ),
                  ),
                ),
              ),
              h(
                "h2",
                {
                  className: "text-navy-800 text-lg font-bold mb-4",
                },
                "Choose Schedule",
              ),
              // Schedule list
              h(
                "div",
                { className: "space-y-3" },
                scheduleData.map((s, i) =>
                  h(
                    "div",
                    {
                      key: i,
                      className:
                        "flex items-center justify-between bg-white rounded-2xl border border-slate-100 shadow-sm p-4",
                    },
                    h(
                      "div",
                      { className: "flex items-center gap-3" },
                      h(Clock, {
                        size: 16,
                        className: "text-navy-800",
                      }),
                      h(
                        "span",
                        {
                          className:
                            "text-navy-800 font-semibold text-sm",
                        },
                        s.from,
                      ),
                      h("span", { className: "text-slate-400" }, "↔"),
                      h(
                        "span",
                        {
                          className:
                            "text-navy-800 font-semibold text-sm",
                        },
                        s.to,
                      ),
                    ),
                    h(
                      "button",
                      {
                        onClick: () => onSelectSchedule(s),
                        className:
                          "bg-navy-800 text-white text-xs font-semibold px-4 py-2 rounded-full hover:bg-navy-700 transition",
                      },
                      "Select",
                    ),
                  ),
                ),
              ),
            ),
            h(BottomNav, { active: "map", onNavigate: () => {} }),
          ),
        );

      /* ----------------------------- Ticket Screen ---------------------------- */

      const TicketScreen = ({ onBack, schedule }) => {
        const [payment, setPayment] = useState("credit");
        return h(
          PhoneFrame,
          null,
          h(
            "div",
            { className: "h-full flex flex-col" },
            // Header
            h(
              "div",
              {
                className:
                  "bg-navy-800 px-7 pt-14 pb-20 flex items-center justify-between",
              },
              h(
                "button",
                {
                  onClick: onBack,
                  className:
                    "p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition",
                },
                h(ArrowLeft, { size: 20 }),
              ),
              h(
                "h1",
                { className: "text-white text-2xl font-bold" },
                "Ticket",
              ),
              h("div", { className: "w-9" }),
            ),
            // Content
            h(
              "div",
              {
                className:
                  "flex-1 bg-slate-50 rounded-t-[2rem] -mt-8 px-6 pt-6 pb-32 overflow-y-auto",
              },
              // Ticket card
              h(
                "div",
                {
                  className:
                    "bg-white rounded-2xl shadow-soft p-5 mb-6 border border-slate-100",
                },
                h(
                  "div",
                  { className: "flex gap-4" },
                  h(
                    "div",
                    { className: "flex-1" },
                    h(
                      "div",
                      { className: "flex" },
                      h(
                        "div",
                        {
                          className:
                            "flex flex-col items-center mr-3 pt-1",
                        },
                        h(MapPin, {
                          size: 16,
                          className: "text-navy-800",
                          fill: "#002266",
                        }),
                        h("div", {
                          className:
                            "flex-1 border-l-2 border-dotted border-slate-300 my-1 min-h-[24px]",
                        }),
                        h(MapPin, {
                          size: 16,
                          className: "text-navy-800",
                        }),
                      ),
                      h(
                        "div",
                        { className: "flex-1" },
                        h(
                          "p",
                          {
                            className:
                              "text-slate-400 text-xs font-medium",
                          },
                          "From",
                        ),
                        h("div", {
                          className:
                            "h-[1px] bg-slate-300 w-full my-2",
                        }),
                        h(
                          "p",
                          {
                            className:
                              "text-slate-400 text-xs font-medium mt-2",
                          },
                          "To",
                        ),
                        h("div", {
                          className:
                            "h-[1px] bg-slate-300 w-full my-2",
                        }),
                      ),
                    ),
                    h(
                      "div",
                      {
                        className:
                          "flex items-center gap-3 mt-3 text-xs text-navy-800 font-semibold",
                      },
                      h(Clock, { size: 14 }),
                      h("span", null, schedule ? schedule.from : "10 : 00"),
                      h(Train, { size: 14 }),
                      h("span", null, schedule ? schedule.to : "10 : 30"),
                    ),
                  ),
                  // QR
                  h(
                    "div",
                    {
                      className:
                        "w-24 h-24 bg-white rounded-xl flex items-center justify-center border border-slate-200",
                    },
                    h(QrCode, {
                      size: 88,
                      className: "text-navy-800",
                      strokeWidth: 1.2,
                    }),
                  ),
                ),
              ),
              // Payment
              h(
                "h2",
                { className: "text-navy-800 text-lg font-bold mb-1" },
                "Payment",
              ),
              h(
                "p",
                {
                  className:
                    "text-navy-800 text-sm font-medium mb-3",
                },
                "Enter Amount",
              ),
              h(
                "div",
                {
                  className:
                    "bg-slate-200/80 rounded-full px-5 py-3 mb-6 text-navy-800 text-sm font-semibold",
                },
                "$ 5.0",
              ),
              // Methods
              h(
                "div",
                { className: "space-y-3 mb-2" },
                h(
                  "button",
                  {
                    onClick: () => setPayment("credit"),
                    className: `w-full flex items-center justify-between py-3 px-5 rounded-full transition ${
                      payment === "credit"
                        ? "bg-navy-800 text-white shadow-soft"
                        : "bg-white text-navy-800 border border-slate-200"
                    }`,
                  },
                  h(
                    "span",
                    { className: "flex items-center gap-3 text-sm font-semibold" },
                    h(CreditCard, { size: 18 }),
                    "Credit Card",
                  ),
                  h(
                    "span",
                    { className: "text-xs opacity-80" },
                    "Balance :",
                  ),
                ),
                h(
                  "button",
                  {
                    onClick: () => setPayment("ewallet"),
                    className: `w-full flex items-center justify-between py-3 px-5 rounded-full transition ${
                      payment === "ewallet"
                        ? "bg-navy-800 text-white shadow-soft"
                        : "bg-white text-navy-800 border border-slate-200"
                    }`,
                  },
                  h(
                    "span",
                    { className: "flex items-center gap-3 text-sm font-semibold" },
                    h(Wallet, { size: 18 }),
                    "E-Wallet",
                  ),
                  h(
                    "span",
                    { className: "text-xs opacity-80" },
                    "Balance :",
                  ),
                ),
              ),
            ),
            // Buy button
            h(
              "div",
              {
                className:
                  "absolute bottom-0 inset-x-0 bg-slate-50 px-6 pb-6 pt-3",
              },
              h(
                "button",
                {
                  className:
                    "w-full bg-navy-800 text-white font-bold py-4 rounded-2xl text-base tracking-wide shadow-card hover:bg-navy-700 transition flex items-center justify-center gap-2",
                },
                "Buy Ticket",
                h(ChevronRight, { size: 18 }),
              ),
            ),
          ),
        );
      };

      /* --------------------------------- App ---------------------------------- */

      function App() {
        const [screen, setScreen] = useState("home");
        const [schedule, setSchedule] = useState(null);

        return h(
          "div",
          {
            className:
              "min-h-screen w-full flex flex-col items-center justify-center p-4 md:p-10",
          },
          h(
            "div",
            {
              className:
                "w-full flex flex-wrap items-center justify-center gap-10",
            },
            // Always display all three as in the reference on large screens
            h(
              "div",
              {
                className: "hidden lg:flex gap-8 items-start",
              },
              h(HomeScreen, {
                onSelectTransport: () => setScreen("schedule"),
              }),
              h(ScheduleScreen, {
                onBack: () => setScreen("home"),
                onSelectSchedule: (s) => {
                  setSchedule(s);
                  setScreen("ticket");
                },
              }),
              h(TicketScreen, {
                onBack: () => setScreen("schedule"),
                schedule,
              }),
            ),
            // Single-screen interactive flow on mobile/tablet
            h(
              "div",
              { className: "lg:hidden w-full flex justify-center" },
              screen === "home" &&
                h(HomeScreen, {
                  onSelectTransport: () => setScreen("schedule"),
                }),
              screen === "schedule" &&
                h(ScheduleScreen, {
                  onBack: () => setScreen("home"),
                  onSelectSchedule: (s) => {
                    setSchedule(s);
                    setScreen("ticket");
                  },
                }),
              screen === "ticket" &&
                h(TicketScreen, {
                  onBack: () => setScreen("schedule"),
                  schedule,
                }),
            ),
          ),
          // Tabs for mobile preview
          h(
            "div",
            {
              className:
                "lg:hidden mt-6 flex gap-2 bg-white/70 backdrop-blur rounded-full p-1 shadow",
            },
            ["home", "schedule", "ticket"].map((s) =>
              h(
                "button",
                {
                  key: s,
                  onClick: () => setScreen(s),
                  className: `px-4 py-2 text-xs font-semibold rounded-full capitalize transition ${
                    screen === s
                      ? "bg-navy-800 text-white"
                      : "text-navy-800"
                  }`,
                },
                s,
              ),
            ),
          ),
        );
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
